[workspace]
resolver = "3"
members = [
    "crates/sinter-core",
    "crates/sinter-store",
    "crates/sinter-extract",
    "crates/sinter-resolve",
    "crates/sinter-cli",
]

[workspace.package]
version = "0.52.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shellfu/sinter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
postcard = { version = "1", features = ["alloc"] }
redb = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
proptest = "1"
tempfile = "3"
# version alongside path so the crates are publishable to crates.io;
# `make bump` rewrites these version strings together with the workspace one.
sinter-core = { version = "0.52.1", path = "crates/sinter-core" }
sinter-store = { version = "0.52.1", path = "crates/sinter-store" }
sinter-extract = { version = "0.52.1", path = "crates/sinter-extract" }
sinter-resolve = { version = "0.52.1", path = "crates/sinter-resolve" }
