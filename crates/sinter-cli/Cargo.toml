[package]
name = "sinter-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "sinter command-line interface"

[[bin]]
name = "sinter"
path = "src/main.rs"

[dependencies]
sinter-core.workspace = true
sinter-store.workspace = true
sinter-extract.workspace = true
sinter-resolve.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow = "1"
rayon = "1"
ignore = "0.4"
notify = "8"
blake3 = "1"
serde.workspace = true
serde_json = "1"
libc = "0.2"
toml = "0.8"
redb.workspace = true
postcard.workspace = true
regex = "1"

[dev-dependencies]
tempfile.workspace = true
# Hand-crafted index.scip fixtures for the dependency-surface tests.
scip = "0.9"
protobuf = "3.7.2"

# cargo-binstall: release assets are sinter-<target>.tar.gz (.zip on Windows)
# with the binary at the archive root, published under the vX.Y.Z tag.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sinter-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
