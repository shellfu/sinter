[package]
name = "sinter-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language-agnostic tree-sitter extraction: languages are data, the engine never forks"

[dependencies]
sinter-core.workspace = true
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-proto = "0.4"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-sequel = "0.3"
# Block grammar only (no "parser" feature: its tree-sitter dep is newer than
# the workspace's; LanguageFn converts version-independently). The split
# inline grammar — where links live — is unused: see queries/markdown.scm.
tree-sitter-md = { version = "0.5", default-features = false }
streaming-iterator = "0.1"
blake3 = "1"
thiserror.workspace = true

[dev-dependencies]
serde = { workspace = true }
serde_json = "1"
