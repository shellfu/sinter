# Release binaries on tag push. `make bump VERSION=x.y.z` creates the tag;
# pushing it (git push origin vX.Y.Z) triggers this. Assets are named
# without the version (sinter-<target>.tar.gz) so install.sh can use the
# stable /releases/latest/download/ URL with no API call.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Accuracy is a release gate, not a newsletter: the eval runs on the tag
  # and `publish` needs it, so a red scorecard stops the release (and the
  # crates.io/PyPI/tap fan-out it dispatches) before anything ships.
  eval:
    uses: ./.github/workflows/real-repository-eval.yml

  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # macos-13 (last Intel pool) is retired — cross-compile on arm.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} -p sinter-io
      - name: package
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/sinter
          strip "$bin" || true
          tar -czf sinter-${{ matrix.target }}.tar.gz -C "$(dirname "$bin")" sinter
          if command -v sha256sum >/dev/null; then
            sha256sum sinter-${{ matrix.target }}.tar.gz > sinter-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 sinter-${{ matrix.target }}.tar.gz > sinter-${{ matrix.target }}.tar.gz.sha256
          fi
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/sinter.exe"
          Compress-Archive -Path $bin -DestinationPath "sinter-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "sinter-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  sinter-${{ matrix.target }}.zip" | Out-File -Encoding ascii "sinter-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            sinter-*.tar.gz*
            sinter-*.zip*

  publish:
    needs: [build, eval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            sinter-*.tar.gz
            sinter-*.zip
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sinter-*.tar.gz* sinter-*.zip* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      # A release created with GITHUB_TOKEN does not emit a workflow-visible
      # `release: published` event, so the fan-out must be dispatched
      # explicitly (workflow_dispatch is exempt from that suppression).
      - name: fan out to pypi, crates.io, and homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in pypi.yml crates.yml tap.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          done
