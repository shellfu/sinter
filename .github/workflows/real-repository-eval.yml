# Pinned real-repository accuracy scorecard. Network-dependent (clones
# public repos), so it lives outside `make gate`, which stays offline.
# Triggers: weekly cron as early warning between releases, on demand, and
# — via workflow_call — as a blocking job in release.yml, where a red
# scorecard stops the release before anything is published.
name: real-repository-eval

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run pinned real-repository evaluation
        run: cargo test --release -p sinter-io --test real_repository_eval -- --ignored --nocapture
      - name: Add scorecard to the job summary
        if: always()
        run: test ! -f target/sinter-eval/scorecard.md || cat target/sinter-eval/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinter-real-repository-scorecard
          path: target/sinter-eval/scorecard.*
          if-no-files-found: error
          retention-days: 30
