# Publish server.json to the official MCP Registry. The release workflow
# dispatches this alongside PyPI; the package wait keeps ownership verification
# from racing the wheel upload.
name: mcp-registry
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: wait for the PyPI package
        run: |
          version=$(jq -r '.version' server.json)
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/sinter-io/${version}/json" >/dev/null; then
              exit 0
            fi
            echo "sinter-io ${version} is not visible on PyPI yet (attempt ${attempt}/60)"
            sleep 10
          done
          exit 1
      - name: install mcp-publisher 1.8.1
        run: |
          curl --fail --location \
            --output /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" \
            | sha256sum --check -
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
      - name: publish server descriptor
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
