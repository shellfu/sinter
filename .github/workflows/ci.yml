name: ci
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Golden corpus first: accuracy is a measured number (R7); a metric
      # move fails here with the missing/extra delta printed.
      - run: cargo test -p sinter-extract --test golden -- --nocapture
      - run: cargo test -p sinter-resolve --test golden_resolution -- --nocapture
      - run: cargo test --workspace
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check publishes its result as a GitHub Check.
      checks: write
    steps:
      - uses: actions/checkout@v4
      # Blocking by design: a known-vulnerable dependency fails CI.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
